version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Node types follow the Node major in .nvmrc, bumped by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check only accepts TypeScript 5 or 6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
